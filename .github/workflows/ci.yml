name: CI

on:
  push:
    branches: [main]
  # Every pull request, not only those aimed at main. A branch stacked on
  # another — which is how a series of related features gets reviewed without
  # waiting on the one below it — targets its parent branch, and with a
  # `branches: [main]` filter it silently gets no CI at all. A pull request
  # that never runs the tests is worse than no pull request, because it looks
  # checked.
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          SUPABASE_SERVICE_ROLE_KEY: placeholder-service-role-key

  # A separate job because it needs a real Postgres carrying the Supabase auth
  # schema, and takes minutes rather than seconds.
  #
  # It has to exist: the isolation tests skip themselves without
  # TEST_DATABASE_URL, so the `npm test` step above stays green while proving
  # nothing at all about tenant isolation.
  rls-isolation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # Applies every migration from an empty database, which also proves they
      # run in order from scratch — something the hosted project never checks,
      # since there they are only ever applied incrementally.
      - name: Start Supabase
        run: supabase start -x realtime,storage-api,imgproxy,studio,edge-runtime,logflare,vector,supavisor

      # Right after the migrations and before anything else, so o inventário é
      # produzido mesmo quando os testes abaixo falham.
      #
      # `schema-inventory.txt` é o esquema que estas migrações têm de produzir.
      # Mudar uma migração sem atualizar o ficheiro falha aqui, que é o ponto:
      # até agora nada notava que a base hospedada e o repositório tinham
      # deixado de descrever a mesma coisa, e a diferença chegou a ser uma
      # coluna que o código lê e que uma base nova não teria (#91).
      #
      # Para atualizar depois de uma alteração de esquema intencional:
      #   psql "$URL" -At -f supabase/schema-inventory.sql | LC_ALL=C sort \
      #     > supabase/schema-inventory.txt
      - name: O esquema é o que as migrações dizem (#91)
        run: |
          psql "$TEST_DATABASE_URL" -At -f supabase/schema-inventory.sql \
            | LC_ALL=C sort > /tmp/inventory-from-repo.txt
          echo "construído a partir das migrações: $(wc -l < /tmp/inventory-from-repo.txt) objetos"
          echo "esperado pelo repositório:         $(wc -l < supabase/schema-inventory.txt) objetos"
          echo
          echo "--- '-' consta do esperado e a migração não o cria"
          echo "--- '+' a migração cria-o e não consta do esperado"
          diff supabase/schema-inventory.txt /tmp/inventory-from-repo.txt \
            && echo "Sem divergência."
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres

      - name: Load the demo dataset
        run: psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/seed-demo.sql
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres

      - name: Tenant isolation tests
        run: npm run test:rls
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres

      # Last, because it destroys the dataset the tests just used. Nothing else
      # in the project ever executes this file, so retiring `projects` (#77)
      # left it referencing three dropped tables and no check anywhere noticed.
      # It only has to run for that to be caught: a delete against a table that
      # no longer exists is an error, not a silent no-op.
      - name: Demo teardown still runs
        run: psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/seed-demo-down.sql
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres

  # A third job, and a third question. `build-and-test` asks whether the code
  # compiles; `rls-isolation` asks who may touch which row. Neither of them ever
  # presses anything, and both were green through every bug reported from
  # production this month — the team that could not be created, the clock that
  # would not start. Those were screens, and only a browser sees a screen.
  #
  # Separate rather than folded into `rls-isolation`: this one also needs the
  # app built and served, and a job that fails could then mean two unrelated
  # things.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start Supabase
        run: supabase start -x realtime,storage-api,imgproxy,studio,edge-runtime,logflare,vector,supavisor

      - name: Load the demo dataset
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f supabase/seed-demo.sql

      # The keys are generated by `supabase start`, so they cannot be written
      # down here. Read them back instead of hardcoding — and fail loudly if a
      # name is missing rather than exporting an empty string: an app that
      # builds with no key still starts, and the failure would then arrive as a
      # Playwright timeout on a page that never loaded, which says nothing about
      # the cause.
      #
      # Two names per key because the CLI moved from the anon/service_role pair
      # to publishable/secret, and a runner pinned to `latest` can hand back
      # either.
      - name: Resolve the Supabase keys
        run: |
          supabase status -o env > /tmp/supabase.env
          echo "chaves devolvidas pela CLI: $(cut -d= -f1 /tmp/supabase.env | tr '\n' ' ')"
          set -a; . /tmp/supabase.env; set +a

          url="${API_URL:-}"
          publishable="${ANON_KEY:-${PUBLISHABLE_KEY:-}}"
          secret="${SERVICE_ROLE_KEY:-${SECRET_KEY:-}}"

          for pair in "url:$url" "publishable:$publishable" "secret:$secret"; do
            if [ -z "${pair#*:}" ]; then
              echo "::error::A CLI do Supabase não devolveu '${pair%%:*}'. Ver a lista de chaves acima."
              exit 1
            fi
          done

          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$url"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$publishable"
            echo "SUPABASE_SERVICE_ROLE_KEY=$secret"
            echo "APP_URL=http://127.0.0.1:3000"
          } >> "$GITHUB_ENV"

      # Built and served, not `next dev`. The dev server compiles a route the
      # first time it is asked for, which turns the first navigation of each
      # test into a timeout waiting on a compiler.
      - name: Build the app
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: End-to-end
        run: npm run test:e2e
